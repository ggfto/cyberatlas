quarkus.application.name=atlas-hub
quarkus.http.port=8080

# O Quinoa builda o atlas-web (Vite) e serve o dist como estatico do hub.
quarkus.quinoa.ui-dir=../atlas-web
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
# Node e npm baixados pelo proprio build: mesma versao no dev, na CI e no build nativo.
# npm 11: o npm 10.9 quebra resolvendo o peer opcional `canvas` do jsdom ("reading 'edgesOut'").
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.23.1
quarkus.quinoa.package-manager-install.npm-version=11.21.1
