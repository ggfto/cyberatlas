quarkus.application.name=atlas-hub
quarkus.http.port=8080

# O Quinoa builda o atlas-web (Vite) e serve o dist como estatico do hub.
quarkus.quinoa.ui-dir=../atlas-web
quarkus.quinoa.build-dir=dist
quarkus.quinoa.enable-spa-routing=true
# Node e npm baixados pelo proprio build: mesma versao no dev, na CI e no build nativo.
# npm 11: o npm 10.9 quebra resolvendo o peer opcional `canvas` do jsdom ("reading 'edgesOut'").
quarkus.quinoa.package-manager-install=true
quarkus.quinoa.package-manager-install.node-version=22.23.1
quarkus.quinoa.package-manager-install.npm-version=11.21.1

# Coleta das fontes (o mapa servido e sempre o merge com o frescor do momento do GET).
atlas.collect.every=30s

# Edges: enrollment e WebSocket so na porta de edge (TLS, so WG/cluster). A CA (atlas.edges.ca-cert/ca-key) e o
# certificado de servidor da porta vem de Secret; sem eles, nenhum edge entra.
# client-auth e fixo no build: a porta TLS pede (nao exige) o cert de cliente; quem exige e o upgrade do /edge
# (EdgeUpgradeCheck). O enrollment usa a mesma porta sem cert. Sem TLS configurado, nao tem efeito.
quarkus.http.ssl.client-auth=request
# Em producao o cert de servidor da porta TLS vem do Secret atlas-pki montado em /pki. Tem que estar declarado
# AQUI, nao so no env: "0" e chave de mapa dinamica (pem.<nome>), e o SmallRye Config so liga
# QUARKUS_TLS_KEY_STORE_PEM_0_CERT a quarkus.tls.key-store.pem.0.cert se a chave existir em alguma fonte. So no env,
# o key store nao se configurava e o Quarkus subia so a 8080, sem erro nenhum (ProdTlsConfigTest).
%prod.quarkus.tls.key-store.pem.0.cert=/pki/server.crt
%prod.quarkus.tls.key-store.pem.0.key=/pki/server.key
%prod.quarkus.tls.trust-store.pem.certs=/pki/ca.crt
quarkus.http.auth.permission.edge.paths=/api/enrollments,/api/enrollments/*,/edge/*
quarkus.http.auth.permission.edge.policy=edge-port

# Argo: app com destino no proprio cluster da VPS (in-cluster) gerencia workloads da VPS. O cluster do host entra
# pelo destination.name/server que o infra cadastrar (ex.: atlas.argocd.cluster-machines.host=host).
atlas.argocd.cluster-machines."in-cluster"=vps
atlas.argocd.cluster-machines."https://kubernetes.default.svc"=vps

# Persistencia da apresentacao (layout manual, auditoria, historico de estado). Fatos nao vao para o banco.
# URL, usuario e senha vem do Secret (QUARKUS_DATASOURCE_JDBC_URL/USERNAME/PASSWORD); em teste, devservices.
quarkus.datasource.db-kind=postgresql
quarkus.flyway.migrate-at-start=true
quarkus.datasource.devservices.image-name=docker.io/library/postgres:17-alpine

# Login (F5): OIDC do Authentik. Browser por sessao (code flow), API tambem por bearer (hybrid). URL, client-id e
# secret vem do Secret (QUARKUS_OIDC_AUTH_SERVER_URL, QUARKUS_OIDC_CLIENT_ID, QUARKUS_OIDC_CREDENTIALS_SECRET).
# Grupos do Authentik viram papel: atlas-viewers (mapa) e atlas-admins (mapa, logs, edges, auditoria).
quarkus.oidc.application-type=hybrid
quarkus.oidc.roles.role-claim-path=groups
# O Authentik so manda o claim groups com o scope profile; o Quarkus pede so openid por padrao (dava 403 no login).
# Os papeis saem do ID token no code flow e do access token no bearer (roles.source sem valor).
# offline_access (issue #20): no Authentik 2025.2 so sai refresh token com esse scope, e so se o provider tiver o mapping
# dele; sem o mapping o Authentik ignora o scope em silencio (o login segue igual, so sem refresh).
quarkus.oidc.authentication.scopes=profile,email,offline_access
# Sessao longa para o /embed no HA (issue #20). O ID/access token do provider atlas vale 1 h (default do Authentik
# 2025.2, o blueprint nao muda); o refresh token, 30 dias. Com refresh-expired, a 1a requisicao depois do exp troca o
# token hub -> Authentik, sem passar pelo browser. O SSE fecha no exp com end {reason:"auth"} e o front confere a
# sessao na hora, entao o refresh acontece a cada hora. A extensao e quanto o cookie (com o refresh token dentro) vive
# alem do exp do ID token: 12 h cobre o tablet do HA dormindo a noite toda ou a aba descartada pelo browser.
quarkus.oidc.token.refresh-expired=true
quarkus.oidc.authentication.session-age-extension=12H
quarkus.oidc.logout.path=/logout
quarkus.oidc.logout.post-logout-path=/
quarkus.oidc.authentication.cookie-same-site=lax
# Lax nao segura CSRF entre subdominios (*.gf2.in e todo same-site): escrita por cookie exige o header X-Atlas-Csrf
# e Origin/Referer desta origem (CsrfGuard, issue #18). Padrao: https://atlas.gf2.in; no dev, o Quinoa na 8080.
%dev.atlas.public-origin=http://localhost:8080
# Callback fixo (o Authentik casa a redirect_uri em modo estrito) e volta para onde a pessoa estava.
quarkus.oidc.authentication.redirect-path=/oidc/callback
quarkus.oidc.authentication.restore-path-after-redirect=true
# Em producao o TLS termina no Traefik: redirect sempre https e cookie de sessao Secure.
%prod.quarkus.oidc.authentication.force-redirect-https-scheme=true
%prod.quarkus.oidc.authentication.cookie-force-secure=true
quarkus.keycloak.devservices.enabled=false
# Sem auth-server-url o hub NAO sobe (falha fechado). Teste e IT apontam para o Authentik de mentira (wiremock);
# os ITs rodam o jar/binario no perfil "it" (prod + isto), porque o perfil "prod" nao ve o %test.
quarkus.test.integration-test-profile=it
%test,it.quarkus.oidc.auth-server-url=${keycloak.url:sem-wiremock}/realms/quarkus/
%test,it.quarkus.oidc.client-id=quarkus-web-app
%test,it.quarkus.oidc.credentials.secret=secret

# Permissoes por caminho (vale o caminho mais especifico). Teste garante que estao ATIVAS (achado do spike da F1).
quarkus.http.auth.policy.viewer.roles-allowed=atlas-viewers,atlas-admins
quarkus.http.auth.policy.admin.roles-allowed=atlas-admins
quarkus.http.auth.permission.health.paths=/q/health,/q/health/*
quarkus.http.auth.permission.health.policy=permit
quarkus.http.auth.permission.ui.paths=/*
# viewer, mas a navegacao de iframe sem sessao recebe o shell do SPA (FramedShellPolicy, issue #20): o 302 para o
# Authentik morre na moldura, e o /embed precisa carregar para oferecer o login em popup. Dados so em /api (401).
quarkus.http.auth.permission.ui.policy=viewer-or-framed-shell
# O bundle do front (JS/CSS do Vite) e o codigo publico do repo: sem ele, o shell enquadrado nao roda.
quarkus.http.auth.permission.assets.paths=/assets/*
quarkus.http.auth.permission.assets.policy=permit
quarkus.http.auth.permission.api.paths=/api/*
quarkus.http.auth.permission.api.policy=viewer
quarkus.http.auth.permission.admin.paths=/api/logs/*,/api/edges,/api/edges/*,/api/audit
quarkus.http.auth.permission.admin.policy=admin
