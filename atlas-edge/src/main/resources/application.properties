quarkus.application.name=atlas-edge
quarkus.http.port=8090
# O edge nao abre porta para fora: so disca para o hub. O HTTP local existe so para o healthcheck
# do container (/q/health), entao em producao ele escuta apenas no loopback.
%prod.quarkus.http.host=127.0.0.1

# O cliente k8s so e usado com atlas.edge.kubernetes=true (kubeconfig/SA da maquina); nunca sobe k3s de teste.
quarkus.kubernetes-client.devservices.enabled=false
